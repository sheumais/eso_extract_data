[package]
name = "eso_extract_data"
description = "Rust port of EsoExtractData: extract data from Elder Scrolls Online MNF/DAT files and convert LANG files"
version = "0.1.0"
edition = "2024"

[dependencies]
eso_common = {git = "https://github.com/sheumais/eso_common" }
clap = { version = "4", features = ["derive"] }
flate2 = "1"


[patch."https://github.com/sheumais/eso_common"]
eso_common = { path = "../eso_common" }